name: Build ESP32-S3 firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: docker://espressif/idf:v5.5.4
        with:
          args: bash -lc "cd $GITHUB_WORKSPACE/esp32_wifi_impl && idf.py set-target esp32s3 && idf.py build"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware
          path: |
            esp32_wifi_impl/build/**/*.bin
            esp32_wifi_impl/build/flash_args
          if-no-files-found: error
